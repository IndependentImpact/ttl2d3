version: "2"
run:
  go: "1.24"
linters:
  enable:
    - gosec
    - misspell
    - revive
    - unparam
  settings:
    revive:
      rules:
        - name: exported
          arguments:
            - disableStutteringCheck
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - forbidigo
        path: ^cmd/
      - linters:
          - gosec
        path: _test\.go
    paths:
      - internal/thirdparty
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/IndependentImpact/ttl2d3
  exclusions:
    generated: lax
    paths:
      - internal/thirdparty
      - builtin$
      - examples$
